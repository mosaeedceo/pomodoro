kind = "mobile"
previewPath = "/"
title = "Pomodoro"
version = "1.0.0"
id = "artifacts/pomodoro"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 18246

[services.development]
run = "pnpm --filter @workspace/pomodoro run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pomodoro", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/pomodoro", "run", "serve" ]

[services.env]
PORT = "18246"
BASE_PATH = "/"
